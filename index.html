<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오페이 송금 및 커피 내기 관리</title>
    
    <link rel="icon" href="https://drive.google.com/uc?export=view&id=18utCRt0LXOtXjkjMmLeBDeGGb_px9xPW">
    <link rel="apple-touch-icon" href="https://drive.google.com/uc?export=view&id=18utCRt0LXOtXjkjMmLeBDeGGb_px9xPW">
    
    <style>
        body { 
            font-family: 'Malgun Gothic', 'Arial', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding-top: 40px; 
            padding-bottom: 40px; 
            background-color: #f0f0f0; 
        }
        .app-title {
            font-size: 2.2em;
            color: #1a1a1a;
            margin-bottom: 40px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            padding: 10px 20px;
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            letter-spacing: -0.5px;
        }
        .instruction {
            margin-bottom: 30px;
            font-size: 1.1em;
            color: #555;
            text-align: center;
        }
        
        /* --- 탭 관련 CSS --- */
        .tabs-wrapper {
            width: 90%;
            max-width: 400px;
        }
        .tabs-container {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-bottom: 0;
            padding: 0;
            position: relative; 
            z-index: 10; 
        }
        .tab-button {
            flex-grow: 1;
            padding: 15px 10px;
            margin: 0 2px;
            border: none;
            border-bottom: 3px solid transparent;
            background-color: #f9f9f9;
            color: #555;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 8px 8px 0 0;
        }
        .tab-button:hover {
            background-color: #eee;
        }
        .tab-button.active {
            background-color: #ffffff;
            border-bottom: 3px solid #FEE500;
            color: #1a1a1a;
        }
        
        /* .tab-content 스타일 */
        .tab-content {
            display: none; 
            width: 100%; 
            align-items: center;
            flex-direction: column;
            padding-top: 3px; 
            margin-top: -3px; 
        }
        .tab-content.active {
            display: flex; 
        }
        /* ------------------------------------- */

        .section-container {
            width: 100%; 
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px; 
        }
        .person-button {
            background-color: #FEE500; 
            color: #191919;
            border: none;
            padding: 20px 40px;
            margin: 10px 0;
            text-align: center;
            text-decoration: none;
            display: block;
            font-size: 18px;
            cursor: pointer;
            border-radius: 12px;
            width: 100%;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s, transform 0.1s;
        }
        .person-button:hover {
            background-color: #ffd400;
            transform: translateY(-2px);
        }
        .calculator-section h3, .record-section h3, .stats-section h3 {
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            font-size: 1.3em;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #444;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }
        #recordBuyerCheckboxes, #recordParticipantCheckboxes { 
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            max-height: 150px;
            overflow-y: auto; 
        }
        #recordBuyerCheckboxes label, #recordParticipantCheckboxes label { 
            font-weight: normal;
            margin-bottom: 0;
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        #recordBuyerCheckboxes input[type="checkbox"], #recordParticipantCheckboxes input[type="checkbox"] { 
            width: auto;
            margin-right: 5px;
        }
        /* 비활성화된 구매자 체크박스 스타일 */
        #recordBuyerCheckboxes input[type="checkbox"]:disabled + label {
            color: #aaa; 
            cursor: not-allowed;
        }

        #calculateButton, #saveRecordButton { 
            background-color: #555; 
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        #calculateButton:hover, #saveRecordButton:hover {
            background-color: #333;
        }

        #calculationResult {
            margin-top: 20px;
            padding: 15px;
            border: 2px solid #FEE500; 
            background-color: #fffde0; 
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            color: #333;
            min-height: 50px;
            display: flex;
            flex-direction: column; 
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        #calculationResult small {
             font-size: 0.8em;
             font-weight: normal;
             color: #777;
             margin-top: 5px;
        }
        #recordsList {
            list-style: none;
            padding: 0;
        }
        #recordsList li {
            background-color: #f9f9f9;
            border: 1px solid #eee;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95em;
        }
        #recordsList li strong {
            color: #333;
        }
        .record-actions { 
            display: flex;
            gap: 5px; 
        }
        .delete-button {
            width: 60px;
            padding: 8px;
            margin: 0;
            font-size: 0.8em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
            border: none;
            color: white;
        }
        .delete-button {
            background-color: #e74c3c;
        }
        .delete-button:hover {
            background-color: #c0392b;
        }
        .stats-chart {
            margin-bottom: 30px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .stats-chart h4 {
            margin-top: 0;
            font-size: 1.1em;
            color: #444;
            margin-bottom: 15px;
        }
        .chart-bar-container {
            background-color: #eee;
            border-radius: 4px;
            margin-bottom: 10px;
            overflow: hidden;
        }
        .chart-bar {
            height: 25px;
            line-height: 25px;
            color: white;
            text-align: right;
            padding-right: 5px;
            font-size: 0.9em;
            font-weight: bold;
            white-space: nowrap;
            transition: width 0.5s ease-out;
        }
        /* 색상 클래스 재사용 */
        .chart-bar.buyer-all { background-color: #3498db; } 
        #latestRegularBuyer {
            padding: 15px;
            background-color: #ecf0f1;
            border: 2px solid #bdc3c7;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 1.1em;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1 class="app-title">💸 송금 및 커피 내기 관리 웹 앱 ☕</h1>
    
    <div class="tabs-wrapper">
        <div class="tabs-container">
            <button class="tab-button active" data-tab-name="calcContent">계산/송금</button>
            <button class="tab-button" data-tab-name="recordContent">기록하기</button>
            <button class="tab-button" data-tab-name="statsContent">통계</button>
        </div>

        <div id="calcContent" class="tab-content active"> 
            <p class="instruction">더치페이 금액을 확인하고, 아래에서 송금할 사람을 선택하세요.</p>

            <div class="section-container calculator-section">
                <h3>💸 더치페이 계산기 (100원 단위 올림 기준)</h3>
                <div class="input-group">
                    <label for="totalAmount">총 금액 (원)</label>
                    <input type="number" id="totalAmount" placeholder="총 금액을 입력하세요 (숫자만)">
                </div>
                <div class="input-group">
                    <label for="numPeople">나눠야 할 인원 (명)</label>
                    <input type="number" id="numPeople" placeholder="나눠야 할 인원수를 입력하세요 (숫자만)">
                </div>
                <button id="calculateButton" onclick="calculateSplit()">계산하기</button>
                <div id="calculationResult">
                    결과를 보려면 '계산하기' 버튼을 눌러주세요.
                </div>
            </div>

            <div class="section-container">
                <h3>💳 카카오페이 송금 바로가기</h3>
                <button class="person-button" onclick="goToKakaopay('구보람')">구보람</button>
                <button class="person-button" onclick="goToKakaopay('김혜빈')">김혜빈</button>
                <button class="person-button" onclick="goToKakaopay('박서연')">박서연</button>
                <button class="person-button" onclick="goToKakaopay('박성희')">박성희</button>
                <button class="person-button" onclick="goToKakaopay('정민경')">정민경</button>
                <button class="person-button" onclick="goToKakaopay('정지희')">정지희</button>
                <button class="person-button" onclick="goToKakaopay('황민구')">황민구</button>
            </div>
        </div>
        
        <div id="recordContent" class="tab-content">
            <div class="section-container record-section">
                <h3>✍️ 내기 기록하기</h3>
                
                <div class="input-group">
                    <label for="recordDate">1. 날짜</label>
                    <input type="date" id="recordDate" value="">
                </div>
                
                <div class="input-group">
                    <label>2. 게임 참여자 (기본값: 모두 체크)</label>
                    <div id="recordParticipantCheckboxes" style="display: flex; flex-wrap: wrap; gap: 10px;">
                    </div>
                </div>

                <div class="input-group">
                    <label>3. 커피 구매자 (당첨자, 중복 선택 가능)</label>
                    <div id="recordBuyerCheckboxes" style="display: flex; flex-wrap: wrap; gap: 10px;">
                    </div>
                </div>
                
                <div class="input-group">
                    <label for="recordGame">4. 무슨 게임?</label>
                    <input type="text" id="recordGame" placeholder="예: 복불복 뽑기, 사다리타기">
                </div>
                
                <button id="saveRecordButton" onclick="saveRecord()">기록 저장 (클라우드/Firebase)</button>
            </div>

            <div class="section-container record-list-section">
                <h3>🗑️ 기록 목록 및 삭제</h3>
                <ul id="recordsList">
                </ul>
            </div>
        </div>

        <div id="statsContent" class="tab-content">
            <div class="section-container stats-section">
                <h3>📊 통계</h3>

                <div id="latestRegularBuyer">
                </div>

                <div style="font-size: 1.1em; font-weight: bold; margin-bottom: 20px; color: #34495e;">
                    총 기록 횟수: <span id="totalRecordsCount">0</span>회
                </div>

                <div class="stats-chart">
                    <h4>1. 커피 구매자 통계 (전체 기록)</h4>
                    <div id="buyerStatsAll">
                    </div>
                </div>
                
                <div class="stats-chart" style="display: none;"> 
                    <div id="buyerStatsRegular"></div>
                </div>
                <div class="stats-chart" style="display: none;"> 
                    <div id="buyerStatsExtra"></div>
                </div>

                <p style="font-size: 0.9em; color: #777;">**막대 그래프는 각 카테고리 내에서 횟수가 가장 많은 사람을 100% 기준으로 표시합니다.</p>
            </div>
            
        </div>
    </div>

    <script type="module">
        // Firebase 모듈 임포트
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, onValue, push, remove } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        // --- 1. Firebase 설정 및 초기화 (고객님의 값) ---
        const firebaseConfig = {
            apiKey: "AIzaSyAf369AzoQLAHD8_Bcck_j3fB2fgQUnglg",
            authDomain: "coffee-bf111.firebaseapp.com",
            databaseURL: "https://coffee-bf111-default-rtdb.firebaseio.com",
            projectId: "coffee-bf111",
            storageBucket: "coffee-bf111.firebasestorage.app",
            messagingSenderId: "1049977125059",
            appId: "1:1049977125059:web:1fb0d5eeb7bbdac2dc4a76",
            measurementId: "G-ZG06GF8VR7"
        };
        
        // Firebase 앱 초기화 및 DB 인스턴스 설정
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app); 
        const recordsRef = ref(db, 'coffeeRecords'); 

        let recordsData = []; 
        
        // --- 데이터 정의 영역 ---
        const kakaopayUrls = {
            '황민구': 'https://qr.kakaopay.com/Ej9Ik0WyG',
            '정지희': 'https://qr.kakaopay.com/FIp8Ra2lC',
            '구보람': 'https://qr.kakaopay.com/Ej7mzDtSG',
            '김혜빈': 'https://qr.kakaopay.com/FL7mOkDUS',
            '정민경': 'https://qr.kakaopay.com/Ej7j0OW09',
            '박서연': 'https://qr.kakaopay.com/FX8cFjPmp',
            '박성희': 'https://qr.kakaopay.com/FTLnTMuOI'
        };
        const memberNames = ['구보람', '김혜빈', '박서연', '박성희', '정민경', '정지희', '황민구'];
        
        // ⭐ 새로운 정렬 함수: 날짜(내림차순) 우선, 타임스탬프(내림차순) 차선 ⭐
        function sortRecords(a, b) {
            // 1. Primary sort: Date (Descending - Newest Date first)
            // '2025-12-02'가 '2025-12-01'보다 먼저 오도록
            if (a.date < b.date) return 1; 
            if (a.date > b.date) return -1; 

            // 2. Secondary sort (Tie-breaker): Timestamp (Descending - Newest Registration first)
            return b.timestamp - a.timestamp;
        }
        // ⭐

        // --- 전역 함수 정의 (window 객체에 바인딩) ---
        window.getRecords = function() {
            return recordsData;
        }

        // 탭 전환 함수 (window 객체에 바인딩)
        window.openTab = function(tabName, elmnt) {
            // 1. 모든 .tab-content 숨기기
            const tabContents = document.getElementsByClassName("tab-content");
            for (let i = 0; i < tabContents.length; i++) {
                tabContents[i].classList.remove("active");
            }

            // 2. 모든 .tab-button의 active 클래스 제거
            const tabButtons = document.getElementsByClassName("tab-button");
            for (let i = 0; i < tabButtons.length; i++) {
                tabButtons[i].classList.remove("active");
            }

            // 3. 현재 탭 콘텐츠 및 버튼 활성화
            const currentContent = document.getElementById(tabName);
            if (currentContent) {
                currentContent.classList.add("active");
            }
            elmnt.classList.add("active");
            
            // 4. 통계 탭이 열릴 때 통계를 다시 렌더링
            if (tabName === 'statsContent') {
                renderStats(); 
            }
        }
        
        // --- Firebase 데이터 리스너 (핵심) ---
        function listenForRecords() {
            onValue(recordsRef, (snapshot) => {
                recordsData = [];
                const data = snapshot.val();
                
                if (data) {
                    recordsData = Object.keys(data).map(key => ({
                        ...data[key],
                        firebaseId: key 
                    })).sort(sortRecords); // ⭐ 변경된 정렬 로직 적용 ⭐
                }
                
                renderRecordsList(); 
                // 통계 탭이 열려있는 경우에만 렌더링
                if(document.getElementById('statsContent').classList.contains('active')) {
                    renderStats();
                }

            }, (error) => {
                console.error("Firebase 데이터 로드 오류:", error);
                alert("⚠️ 기록 데이터를 불러오는 데 실패했습니다. 콘솔을 확인하십시오.");
            });
        }
        
        // 참여자 체크박스 상태에 따라 구매자 체크박스 제어
        function updateBuyerCheckboxes() {
            memberNames.forEach(name => {
                const participantCheckbox = document.getElementById('participant-' + name);
                const buyerCheckbox = document.getElementById('buyer-' + name);
                
                if (!participantCheckbox || !buyerCheckbox) return;

                if (participantCheckbox.checked) {
                    // 참여자로 선택된 경우: 구매자 선택 가능 (활성화)
                    buyerCheckbox.disabled = false;
                } else {
                    // 참여자로 선택되지 않은 경우: 구매자 선택 불가능 (비활성화 및 강제 체크 해제)
                    buyerCheckbox.checked = false; 
                    buyerCheckbox.disabled = true;
                }
            });
        }

        // --- 기록 입력 필드 초기화 및 체크박스 생성 함수 ---
        function initializeRecordInputs() {
            const buyerContainer = document.getElementById('recordBuyerCheckboxes');
            const participantContainer = document.getElementById('recordParticipantCheckboxes');
            if (!buyerContainer || !participantContainer) return; 
            
            const sortedMembers = [...memberNames].sort(); 

            sortedMembers.forEach(name => {
                // 1. Buyer Checkboxes (구매자/당첨자)
                let buyerCheckboxDiv = document.createElement('div');
                buyerCheckboxDiv.style.marginRight = '10px';
                let buyerCheckbox = document.createElement('input');
                buyerCheckbox.type = 'checkbox';
                buyerCheckbox.id = 'buyer-' + name;
                buyerCheckbox.name = 'recordBuyer';
                buyerCheckbox.value = name;
                
                let buyerLabel = document.createElement('label');
                buyerLabel.htmlFor = 'buyer-' + name;
                buyerLabel.textContent = name;
                buyerLabel.style.marginLeft = '5px';
                buyerCheckboxDiv.appendChild(buyerCheckbox);
                buyerCheckboxDiv.appendChild(buyerLabel);
                buyerContainer.appendChild(buyerCheckboxDiv);
                
                // 2. Participant Checkboxes (참여자)
                let participantCheckboxDiv = document.createElement('div');
                participantCheckboxDiv.style.marginRight = '10px';
                let participantCheckbox = document.createElement('input');
                participantCheckbox.type = 'checkbox';
                participantCheckbox.id = 'participant-' + name;
                participantCheckbox.name = 'recordParticipant';
                participantCheckbox.value = name;
                participantCheckbox.checked = true; // ⭐ 기본값: 모두 체크
                
                // 이벤트 리스너 추가: 참여자 상태 변경 시 구매자 제어
                participantCheckbox.addEventListener('change', updateBuyerCheckboxes); 
                
                let participantLabel = document.createElement('label');
                participantLabel.htmlFor = 'participant-' + name;
                participantLabel.textContent = name;
                participantLabel.style.marginLeft = '5px';
                participantCheckboxDiv.appendChild(participantCheckbox);
                participantCheckboxDiv.appendChild(participantLabel);
                participantContainer.appendChild(participantCheckboxDiv);
            });
            
            // 초기 로드 시 구매자 체크박스 상태 업데이트 
            updateBuyerCheckboxes(); 
        }
        
        // HTML 문서 로드 후 실행 
        document.addEventListener('DOMContentLoaded', function() {
            try {
                const recordDateInput = document.getElementById('recordDate');
                if (recordDateInput) {
                    const today = new Date().toISOString().split('T')[0];
                    recordDateInput.value = today;
                }
                
                initializeRecordInputs(); 
                
                listenForRecords(); 

                // 탭 버튼에 이벤트 리스너 바인딩
                const tabButtons = document.querySelectorAll('.tab-button');
                tabButtons.forEach(button => {
                    button.addEventListener('click', function() {
                        const tabName = this.getAttribute('data-tab-name');
                        if (tabName) {
                            window.openTab(tabName, this);
                        }
                    });
                });

            } catch (error) {
                console.error("앱 초기화 중 오류 발생:", error);
                alert("⚠️ 앱 초기화 오류. 콘솔 로그를 확인하십시오.");
            }
        });

        // --- 송금 및 계산기 기능 ---
        window.goToKakaopay = function(personName) {
            const url = kakaopayUrls[personName];
            if (url) {
                window.location.href = url;
            } else {
                alert(personName + '님의 송금 코드가 설정되지 않았습니다.');
            }
        }

        window.calculateSplit = function() {
            const totalAmountInput = document.getElementById('totalAmount');
            const numPeopleInput = document.getElementById('numPeople');
            const resultDiv = document.getElementById('calculationResult');

            const rawTotalAmount = parseInt(totalAmountInput.value);
            const numPeople = parseInt(numPeopleInput.value);

            if (isNaN(rawTotalAmount) || isNaN(numPeople) || rawTotalAmount <= 0 || numPeople <= 0) {
                resultDiv.innerHTML = "총 금액과 인원수를 정확히 입력해 주세요.";
                return;
            }
            
            const totalAmount = Math.ceil(rawTotalAmount / 100) * 100;
            
            let roundingNote = "";
            if (rawTotalAmount !== totalAmount) {
                roundingNote = `<br><small>입력하신 ${rawTotalAmount.toLocaleString()}원이 100원 단위 올림되어 ${totalAmount.toLocaleString()}원으로 산정되었습니다.</small>`;
            } else if (rawTotalAmount === totalAmount && rawTotalAmount % 100 === 0) {
                 roundingNote = `<br><small>총 금액 ${totalAmount.toLocaleString()}원 기준 분배입니다.</small>`;
            }

            const basicAmount = Math.floor(totalAmount / numPeople / 100) * 100;
            const remainder = totalAmount - (basicAmount * numPeople);
            const extraPeople = remainder / 100; 
            const higherAmount = basicAmount + 100;
            const lowerAmount = basicAmount;

            let resultText = "";
            
            if (extraPeople > 0 && extraPeople <= numPeople) {
                const lowerPeople = numPeople - extraPeople;
                
                if (lowerPeople === 0 && basicAmount === higherAmount - 100) {
                     resultText = `**모두** ${basicAmount.toLocaleString()}원`;
                } else {
                     resultText = `**${extraPeople}명** ${higherAmount.toLocaleString()}원, **${lowerPeople}명** ${lowerAmount.toLocaleString()}원`;
                }
            } else if (totalAmount > 0 && totalAmount < 100 && numPeople >= 1) {
                const peopleFor100 = Math.ceil(totalAmount / 100);
                const peopleFor0 = numPeople - peopleFor100;

                resultText = `**${peopleFor100}명** 100원, **${peopleFor0}명** 0원`;
            } else {
                 resultText = `**모두** ${basicAmount.toLocaleString()}원`;
            }

            resultDiv.innerHTML = resultText + roundingNote;
        }

        // --- 기록 저장 기능 (V9 push 사용) ---
        window.saveRecord = function() {
            const date = document.getElementById('recordDate').value;
            const checkedBuyers = Array.from(document.querySelectorAll('input[name="recordBuyer"]:checked'))
                                       .map(cb => cb.value);
            // Participants
            const selectedParticipants = Array.from(document.querySelectorAll('input[name="recordParticipant"]:checked'))
                                       .map(cb => cb.value);
            const game = document.getElementById('recordGame').value.trim();

            if (!date || checkedBuyers.length === 0 || selectedParticipants.length === 0 || !game) {
                alert('날짜, 커피 구매자 (최소 1명), 게임 참여자 (최소 1명), 무슨 게임은 필수 입력 항목입니다.');
                return;
            }
            
            // 최종 유효성 검사: 구매자가 참여자에 포함되는지 확인
            const invalidBuyers = checkedBuyers.filter(buyer => !selectedParticipants.includes(buyer));
            if (invalidBuyers.length > 0) {
                 alert(`⚠️ 오류: [${invalidBuyers.join(', ')}] 님은 게임 참여자가 아닙니다. 참여자로 선택된 사람만 구매자로 선택할 수 있습니다.`);
                 return;
            }

            const newRecord = {
                date: date,
                buyer: checkedBuyers, 
                participants: selectedParticipants, 
                game: game,
                timestamp: Date.now() 
            };

            // Firebase에 저장
            push(recordsRef, newRecord) 
                .then(() => {
                    alert(`✅ 기록이 클라우드(Firebase)에 저장되었습니다! 모든 기기에서 동기화됩니다.`);
                    // 입력 필드 초기화
                    document.getElementById('recordGame').value = ''; 
                    document.querySelectorAll('input[name="recordBuyer"]:checked').forEach(cb => cb.checked = false);
                    document.querySelectorAll('input[name="recordParticipant"]').forEach(cb => cb.checked = true); // 참여자는 다시 모두 체크
                    updateBuyerCheckboxes(); // 초기화 후 구매자 상태도 업데이트
                })
                .catch(error => {
                    alert(`⚠️ 기록 저장 실패: ${error.message}`);
                    console.error("Firebase 저장 오류:", error);
                });
        }

        // --- 기록 삭제 기능 (V9 remove 사용) ---
        window.deleteRecord = function(firebaseId) {
            if (!confirm('정말로 이 기록을 삭제하시겠습니까? (클라우드 데이터에서 영구 삭제되며, 모든 기기에 반영됩니다.)')) {
                return;
            }
            
            const recordToDeleteRef = ref(db, 'coffeeRecords/' + firebaseId);
            remove(recordToDeleteRef) 
                .then(() => {
                    alert('✅ 기록이 클라우드에서 삭제되었습니다.');
                })
                .catch(error => {
                    alert(`⚠️ 삭제 실패: ${error.message}`);
                    console.error("Firebase 삭제 오류:", error);
                });
        }

        // --- 기록 목록 렌더링 (수정 버튼 제거) ---
        function renderRecordsList() {
            const recordsListElement = document.getElementById('recordsList');
            if (!recordsListElement) return; 

            recordsListElement.innerHTML = '';
            
            const records = getRecords(); // 이미 정렬된 recordsData를 가져옴

            if (records.length === 0) {
                recordsListElement.innerHTML = '<li>아직 기록된 내역이 없습니다.</li>';
                return;
            }

            records.forEach(record => {
                const listItem = document.createElement('li');
                
                const dateParts = record.date.split('-'); 
                const dateDisplay = `${dateParts[1]}/${dateParts[2]}`; 
                
                const buyerDisplay = Array.isArray(record.buyer) ? record.buyer.join(', ') : record.buyer; 
                
                const participantInfo = Array.isArray(record.participants) 
                    ? `<br><small>참여자: ${record.participants.join(', ')}</small>` 
                    : '';
                
                const typeDisplay = record.type ? `[${record.type}] ` : ''; 
                
                listItem.innerHTML = `
                    <div>
                        ${typeDisplay} ${dateDisplay} - **${buyerDisplay}** 당첨! <br>
                        <small>게임: ${record.game}</small>
                        ${participantInfo}
                    </div>
                    <div class="record-actions">
                        <button class="delete-button" onclick="deleteRecord('${record.firebaseId}')">삭제</button>
                    </div>
                `; 
                recordsListElement.appendChild(listItem);
            });
        }
        
        // --- 통계 기능 ---
        function getBuyerCounts(records) {
            const buyerCounts = memberNames.reduce((acc, name) => {
                acc[name] = 0; 
                return acc;
            }, {});
            
            records.forEach(record => {
                const buyers = Array.isArray(record.buyer) ? record.buyer : [record.buyer].filter(Boolean);
                
                buyers.forEach(buyerName => {
                    buyerCounts[buyerName] = (buyerCounts[buyerName] || 0) + 1;
                });
            });
            return buyerCounts;
        }

        function renderStats() {
            const allRecords = getRecords(); // 이미 날짜 기준으로 정렬된 데이터
            const totalCount = allRecords.length;
            const totalRecordsCountElement = document.getElementById('totalRecordsCount');
            if (totalRecordsCountElement) totalRecordsCountElement.textContent = totalCount;
            
            const latestRegularBuyerDiv = document.getElementById('latestRegularBuyer');
            
            if (totalCount === 0) {
                const clearStats = (id) => {
                    const el = document.getElementById(id);
                    if (el) el.innerHTML = '<p>기록이 없어 통계를 표시할 수 없습니다.</p>';
                };
                clearStats('buyerStatsAll');
                document.getElementById('buyerStatsRegular').innerHTML = '';
                document.getElementById('buyerStatsExtra').innerHTML = '';
                
                if (latestRegularBuyerDiv) latestRegularBuyerDiv.innerHTML = '<span>기록이 없습니다.</span>';
                return;
            }
            
            // ⭐⭐⭐ 연속 구매자 확인 로직 (날짜 기준 정렬된 데이터 사용) ⭐⭐⭐
            const allSortedRecords = allRecords; // 이미 sortRecords 함수로 정렬됨 (날짜 내림차순)
            const consecutiveBuyers = new Set();
            
            memberNames.forEach(member => {
                // 1. 해당 멤버가 '참여자'로 포함된 모든 기록을 날짜순(최신순)으로 추출
                const memberParticipantRecords = allSortedRecords.filter(r => 
                    r.participants && (Array.isArray(r.participants) ? r.participants.includes(member) : r.participants === member)
                );
                
                // 참여 기록이 2개 이상일 때만 검사
                if (memberParticipantRecords.length >= 2) {
                    // 가장 최근의 참여 게임 2개만 추출 (날짜 기준 최신 2개)
                    const recentTwoParticipations = memberParticipantRecords.slice(0, 2); 
                    
                    const latestRecord = recentTwoParticipations[0]; // 가장 최근 참여 게임
                    const previousRecord = recentTwoParticipations[1]; // 그 이전 참여 게임
                    
                    // 각 게임에서 이 멤버가 '구매자(당첨자)'인지 확인
                    const isLatestBuyer = latestRecord.buyer && 
                        (Array.isArray(latestRecord.buyer) ? latestRecord.buyer.includes(member) : latestRecord.buyer === member);
                        
                    const isPreviousBuyer = previousRecord.buyer && 
                        (Array.isArray(previousRecord.buyer) ? previousRecord.buyer.includes(member) : previousRecord.buyer === member);
                    
                    // 두 게임 모두에서 구매자(당첨자)인 경우 연속 당첨으로 간주
                    if (isLatestBuyer && isPreviousBuyer) {
                        consecutiveBuyers.add(member);
                    }
                }
            });

            const consecutiveBuyerList = Array.from(consecutiveBuyers).join(', ');

            if (latestRegularBuyerDiv) {
                if (consecutiveBuyerList.length > 0) {
                    latestRegularBuyerDiv.innerHTML = `
                        🚨 **경고: 2회 연속 구매자 (참여한 가장 최근 2개 날짜 기준):** <span style="color:#e74c3c;">${consecutiveBuyerList}</span>
                        <br><small>자신이 **참여한** 가장 최근 2개의 게임(날짜 기준)에서 모두 당첨된 사람입니다.</small>
                    `;
                } else {
                    latestRegularBuyerDiv.innerHTML = '✅ **참여한 가장 최근 2개의 게임(날짜 기준)에서 연속으로 걸린 사람이 없습니다.**';
                }
            }
            // ⭐⭐⭐ 연속 구매자 확인 로직 끝 ⭐⭐⭐


            // ⭐⭐⭐ 통계 차트 단순화: 전체 구매자 통계만 사용 ⭐⭐⭐
            const buyerCountsAll = getBuyerCounts(allRecords);
            drawBarChart('buyerStatsAll', buyerCountsAll, totalCount, 'buyer-all');
            
            document.getElementById('buyerStatsRegular').innerHTML = ''; 
            document.getElementById('buyerStatsExtra').innerHTML = ''; 
        }

        function drawBarChart(elementId, dataCounts, totalCount, baseClass, colorMap = {}) {
            const container = document.getElementById(elementId);
            if (!container) return; 
            
            container.innerHTML = ''; 

            const sortedKeys = Object.keys(dataCounts).sort((a, b) => dataCounts[b] - dataCounts[a]);

            const maxCount = Math.max(...Object.values(dataCounts), 1); 

            sortedKeys.forEach(key => {
                const count = dataCounts[key];
                const percentage = count > 0 ? (count / maxCount) * 100 : 0;
                const barColorClass = colorMap[key] || baseClass;

                if (count === 0 && elementId.includes('buyerStats')) {
                    return; 
                }

                const chartItem = document.createElement('div');
                chartItem.innerHTML = `
                    <p style="margin: 5px 0 0; font-size: 0.9em;">**${key}** (${count}회)</p>
                    <div class="chart-bar-container">
                        <div class="chart-bar ${barColorClass}" style="width: ${percentage}%;">
                            ${count > 0 ? count + '회' : ''}
                        </div>
                    </div>
                `;
                container.appendChild(chartItem);
            });
        }
        
    </script>
